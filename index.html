<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Credit Balance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1>Tracking Credit Balance</h1>

<div class="title-row">
      <div class="title-wrap">
        <span class="pencil-icon">&#9998;</span>
        <input type="text" id="sheetTitle" class="sheet-title" placeholder="Sheet Name">
      </div>
      <button id="saveBtn">Save</button>
      <button class="clear-btn" id="clearBtn">New</button>
      <button class="delete-btn" id="deleteBtn">Delete</button>
      <button class="print-btn" id="printBtn">Print (PDF)</button>
    </div>

    <div class="table-scroll">
      <table class="sheet">
        <thead>
          <tr>
            <th data-sort="index">#</th>
            <th data-sort="card">Credit Card Name</th>
            <th data-sort="amount">Balance</th>
            <th data-sort="apr">APR</th>
            <th data-sort="promo">Pro APR</th>
            <th data-sort="promoEnd">Pro End Date</th>
            <th data-sort="balTransPct">Bal Trans Fee %</th>
            <th data-sort="balTransAmt">Bal Trans Amt</th>
            <th data-sort="discount">Min Pay Amt</th>
            <th data-sort="date">Due Date</th>
            <th data-sort="note">Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rowsBody"></tbody>
        <tfoot>
          <tr>
            <td colspan="1">
              <button id="addRowBtn" class="add-row-btn" title="Add Row">+</button>
            </td>
          </tr>
          <tr class="total-foot-row">
            <td class="total-label">&#931;</td>
            <td></td>
            <td class="sum-val-cell"><strong id="amountSum">0</strong></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td class="sum-val-cell"><strong id="balTransAmtSum">0</strong></td>
            <td class="sum-val-cell"><strong id="discountSum">0</strong></td>
            <td colspan="3"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="save-bar">
      <select id="savedSheets">
        <option value="">Load a saved sheet...</option>
      </select>
      <button class="io-btn" id="exportBtn" title="Export Local storage data">Export</button>
      <button class="io-btn" id="importBtn" title="Import Local storage data">Import</button>
      <button class="io-btn clear-io-btn" id="clearStorageBtn" title="Clear all Local storage data">Clear</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
